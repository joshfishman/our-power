name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '!docs/scorecard-methodology.md' # methodology changes still trigger CI (audit-relevant)
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '!docs/scorecard-methodology.md'
      - '.gitignore'
      - 'LICENSE'

# Cancel in-flight runs for the same ref when a new commit lands (e.g. force-push during rebase).
# `group` uses workflow + ref so PR runs and main-branch runs don't cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimum-required permissions for all jobs. Individual jobs can widen if needed (none currently do).
permissions:
  contents: read

env:
  # Dummy env vars for build - not real credentials
  DATABASE_URL: "postgresql://user:pass@localhost:5432/db?pgbouncer=true"
  DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
  NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key"
  SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key"
  AUTH_SECRET: "dummy-auth-secret-for-ci-builds-only"
  AUTH_URL: "http://localhost:3000"
  NODE_VERSION: "22"

# Reusable setup notes:
# Actions are pinned to commit SHAs (with version comments) per GitHub's hardened-runner
# best practice. Renovate/Dependabot can still bump these via the trailing `# v...` comment.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache Prisma client
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: src/generated/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('prisma/schema.prisma') }}
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache Prisma client
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: src/generated/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('prisma/schema.prisma') }}
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache Prisma client
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: src/generated/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('prisma/schema.prisma') }}
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run test:run

  scorecard:
    name: Agent-Native Scorecard
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache Prisma client
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: src/generated/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('prisma/schema.prisma') }}
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      # Visibility: emit scorecard JSON to logs and artifact
      - name: Generate scorecard
        run: |
          npx vitest run src/__tests__/agent-native-scorecard.test.ts --reporter=json 2>/dev/null \
            | node -e "
                const chunks = [];
                process.stdin.on('data', c => chunks.push(c));
                process.stdin.on('end', () => {
                  try {
                    const r = JSON.parse(Buffer.concat(chunks));
                    // Extract test names to confirm passage
                    const tests = (r.testResults || []).flatMap(f => f.assertionResults || []);
                    console.log('Scorecard tests:', tests.map(t => t.fullName + ' - ' + t.status).join('\n'));
                  } catch { process.stdout.write(Buffer.concat(chunks)); }
                });
              " || true
      # Soft gate: non-regression baseline enforced by the test suite itself
      - name: Scorecard non-regression gate (soft)
        run: npx vitest run src/__tests__/agent-native-scorecard.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache Prisma client
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: src/generated/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('prisma/schema.prisma') }}
      - name: Cache Next.js build
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .next/cache
          # Bust cache when dependencies or source files change
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run build

  # Aggregate gate — use this as the single required check in branch protection so adding/renaming
  # individual jobs doesn't require re-configuring required checks each time.
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, scorecard, build]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Verify all required jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          # Fail if any upstream job didn't succeed (skipped/failed/cancelled all count as failure).
          echo "$NEEDS_JSON" | node -e "
            const needs = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const bad = Object.entries(needs).filter(([_, v]) => v.result !== 'success');
            if (bad.length) {
              console.error('Failed jobs:', bad.map(([k, v]) => k + '=' + v.result).join(', '));
              process.exit(1);
            }
            console.log('All required jobs succeeded.');
          "
